# Zusatz fuer den CraftBeerPi-Dienst auf dem Brau-Pi. Ablage:
#   /etc/systemd/system/craftbeerpi.service.d/brausteuerung-sicher.conf
# Danach: sudo systemctl daemon-reload
#
# - Alle Ausgaenge des HAT vor dem Start und nach jedem Ende (auch Absturz,
#   kill -9) auf AUS. HAT Biersteuerung schaltet bei HIGH, also "dl" = aus.
#   Relais: 27 Kessel (J4), 20 Heizelement (J8), 18 Ruehrwerk (J7),
#   19 J13 (Kuehlschrank; beim alten HAT ohne Ventilausgaenge das Wasserventil),
#   21/22 Reserve (J15/J16).
#   Ventile (HAT mit Ventilausgaengen, Stand Biersteuerung f5a2bcf): 16/17/26/13
#   Druckventile 1-4 (J17), 9 Brauwasser, 10 Kuehlspirale, 11 Dampfkondensator (J20).
#   Beim alten HAT sind 16/17/26/13/9/10/11 frei; LOW schadet dort nicht.
# - Nach einem Absturz neu starten; das Plugin "Fortsetzen" nimmt die Rast wieder auf.
# - Erst starten, wenn der 1-Wire-Treiber geladen ist.
# - "$$g" ist Absicht: systemd ersetzt "$g" selbst, "$$" ergibt ein "$" fuer die Shell.
# Ersetzt ventil-zu.conf aus cbpi4-ventil (dort nur der Ventil-GPIO).
[Unit]
After=network.target sys-subsystem-net-devices-lo.device
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
ExecStartPre=-/bin/sh -c 'for g in 27 20 18 19 21 22 16 17 26 13 9 10 11; do /usr/bin/pinctrl set $$g op dl; done'
ExecStartPre=-/sbin/modprobe w1-gpio
ExecStartPre=-/sbin/modprobe w1-therm
ExecStopPost=-/bin/sh -c 'for g in 27 20 18 19 21 22 16 17 26 13 9 10 11; do /usr/bin/pinctrl set $$g op dl; done'
Restart=always
RestartSec=3
Environment=LG_WD=/tmp

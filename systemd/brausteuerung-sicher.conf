# Zusatz fuer den CraftBeerPi-Dienst auf dem Brau-Pi. Ablage:
#   /etc/systemd/system/craftbeerpi.service.d/brausteuerung-sicher.conf
# Danach: sudo systemctl daemon-reload
#
# - Alle Ausgaenge des HAT vor dem Start und nach jedem Ende (auch Absturz,
#   kill -9) auf AUS: 27 Kessel, 20 Heizelement, 18 Ruehrwerk, 19 Wasserventil,
#   21/22 Reserve. HAT Biersteuerung schaltet bei HIGH, also "dl" = aus.
# - Nach einem Absturz neu starten; das Plugin "Fortsetzen" nimmt die Rast wieder auf.
# - Erst starten, wenn der 1-Wire-Treiber geladen ist.
# Ersetzt ventil-zu.conf aus cbpi4-ventil (dort nur GPIO 19).
[Unit]
After=network.target sys-subsystem-net-devices-lo.device
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
ExecStartPre=-/usr/bin/pinctrl set 27 op dl
ExecStartPre=-/usr/bin/pinctrl set 20 op dl
ExecStartPre=-/usr/bin/pinctrl set 18 op dl
ExecStartPre=-/usr/bin/pinctrl set 19 op dl
ExecStartPre=-/usr/bin/pinctrl set 21 op dl
ExecStartPre=-/usr/bin/pinctrl set 22 op dl
ExecStartPre=-/sbin/modprobe w1-gpio
ExecStartPre=-/sbin/modprobe w1-therm
ExecStopPost=-/usr/bin/pinctrl set 27 op dl
ExecStopPost=-/usr/bin/pinctrl set 20 op dl
ExecStopPost=-/usr/bin/pinctrl set 18 op dl
ExecStopPost=-/usr/bin/pinctrl set 19 op dl
ExecStopPost=-/usr/bin/pinctrl set 21 op dl
ExecStopPost=-/usr/bin/pinctrl set 22 op dl
Restart=always
RestartSec=3
Environment=LG_WD=/tmp
